<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>なんでも募集サイト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-size: 24px;
    }
    .card {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 14px;
      border: none;
      background: #333;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>  <h1>なんでも募集サイト</h1>  <div class="card">
    <input id="title" placeholder="タイトル" />
    <textarea id="desc" placeholder="説明"></textarea>
    <button onclick="addPost()">投稿する</button>
  </div>  <div id="posts"></div>  <script>
    const posts = [
      { title: "テスト募集", desc: "何でもOKのテスト投稿" }
    ];

    function render() {
      const container = document.getElementById("posts");
      container.innerHTML = "";

      posts.forEach(p => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<b>${p.title}</b><br><small>${p.desc}</small>`;
        container.appendChild(div);
      });
    }

    function addPost() {
      const title = document.getElementById("title").value;
      const desc = document.getElementById("desc").value;

      if (!title || !desc) return;

      posts.unshift({ title, desc });

      document.getElementById("title").value = "";
      document.getElementById("desc").value = "";

      render();
    }

    render();
  </script></body>
</html>
